# 知识库：单文件 YAML。整体会编译进 system prompt，保持静态以命中模型前缀缓存。
# 规模建议 2000 字以内（约 3k token）。改完保存、重启进程即生效。
#
# route 取值：
#   answer             可直接回复用户（必须写 answer）
#   forward            需转交人工（建议写 forward_hint）
#   answer_and_forward 先回复用户，同时转交人工（用户自助能办、但可能需要人工兜底的场景）
#
# 变量：在顶层 variables 里定义，正文用 {{名称}} 引用。
# 名称只能用字母、数字、下划线、短横线；变量可以引用别的变量（电话、网址这类只写一处）。
# 未定义、循环引用、名字写错都会在启动时报错并拒绝启动，不会把花括号原样发给同学。

variables:
  # 当前发布版本。必须加引号：不加引号的 5.0 之类会被 YAML 当成数字，小数位会丢掉
  latest-version: "5.16.0"

  # 应用下载站（官网）+ 群文件兜底
  app-download: https://incu.ncu.edu.cn/
  app-package-hint: 群文件内也有最新版安装包

  # 教务系统入口与咨询电话
  jwpt: https://jwpt.ncu.edu.cn/jsxsd/sso.jsp
  jwpt-phone: "0791-83969101"

entries:
  - id: greeting
    title: 打招呼 / 使用引导
    keywords: [你好, 在吗, 怎么用, 帮助]
    route: answer
    answer: |
      你好，我是homebot。直接@我发问题给我就行；
      如果是报错或界面异常，把截图一起发过来，最后再@我。

  - id: reset-phone
    title: 修改手机号
    keywords: [手机号, 新手机, 手机卡丢了, 登录不上, 无法登录]
    route: answer_and_forward
    answer: |
      旧手机号还能用的话，打开南大家园-生活-云家园-右上角账号设置-密保手机，自己就能改；
      旧号已经不能用了就得我们手动帮你处理，这条消息我已经帮你转给负责的同学了。
    forward_hint: |
      请稍后私信负责的同学你的姓名、学号、新手机号、旧手机号，请勿发到群里

  - id: reset-password
    title: 重置密码
    keywords: [密码]
    route: answer
    answer: |
      原手机号还能用的话，退出登录-云家园登录-忘记密码

  - id: no-schedule
    title: 没有课表 / 不显示课表
    keywords: [没课表, 不显示]
    route: answer
    answer: |
      请尝试连接校园网、他人热点（移动卡可能会有连接问题）；或打开教务系统（{{jwpt}}）-「学期理论课表」查看本学期是否有课。如果教务系统中也查不到本学期课表，请联系教务处 {{jwpt-phone}}；如果教务系统有课、只有南大家园不显示，请直接反馈给我们。

  - id: wrong-schedule
    title: 课表有误 / 选课完课表不同步
    keywords: [课表, 课程, 缺课, 少课, 不一致, 不一样, 选课, 退课]
    route: answer
    answer: |
      课表每日同步，刚选退课需要等待明天同步，请以教务系统为准。可对比教务系统（{{jwpt}}）-「学期理论课表」查看是否确有此课；如果教务系统中的课程信息有误，请联系教务处 {{jwpt-phone}}，如果只有南大家园未同步，请直接反馈给我们。

  - id: major-change-not-sync
    title: 转专业后资料未同步
    keywords: [转专业]
    route: forward
    forward_hint: |
      请稍后联系负责的同学，提供原学院和班级、现学院和班级、学号、现辅导员名字

  - id: wrong-credit
    title: 绩点对不上教务系统
    keywords: [绩点]
    route: answer
    answer: |
      请以教务系统（{{jwpt}}）绩点为准。

  - id: download
    title: 下载南大家园
    keywords: [下载, 更新]
    route: answer
    answer: |
      请在 {{app-download}} 下载最新版南大家园（当前版本 {{latest-version}}），{{app-package-hint}}

  - id: wrong-timeline
    title: 上课时间不对
    keywords: [下载, 更新]
    route: answer
    answer: |
      根据教务处2026秋季学期上课时间变动，我们已更新南大家园时间表，请在 {{app-download}} 更新最新版南大家园（{{latest-version}}），{{app-package-hint}}

  - id: master-student
    title: 研究生能否使用南大家园
    keywords: [硕士, 博士, 研究生]
    route: answer
    answer: |
      十分抱歉，由于缺少数据，南大家园暂不支持研究生使用

  - id: ncu-center
    title: 融合门户 / 企业微信 / 邮箱 / 校园网 相关问题
    keywords: [融合门户, 企业微信, 邮箱, 校园网]
    route: answer
    answer: |
      请联系南昌大学网络与信息中心。
      联系电话：0791-83968673，0791-83969312
      工作时间：8:30-12:00，13:30-22:00

  - id: mystery-store
    title: 神秘商店是什么
    keywords: [神秘商店]
    route: answer
    answer: |
      可以用兑换码兑换神秘物品的地方——可以关注一下我们的后续活动

  - id: electric-app-missing
    title: 电费查询应用不见了
    keywords: [电费]
    route: answer
    answer: |
      根据学校要求，南大家园电费查询已下架。请前往企业微信一码通查询和缴费

  - id: electric
    title: 电费对不上 / 交了钱没电
    keywords: [电费, 电]
    route: answer
    answer: |
      请联系学校水电中心 0791-83969182 或 15797965280 (金老师)
  
  - id: select-course-on-incu
    title: 南大家园的选课是真的吗
    keywords: [选课, 自定义课程]
    route: answer
    answer: |
      不是的，选课必须上教务系统，南大家园只是提供了一个自定义课程的功能，方便同学们蹭课。具体选课时间请以教务处通知为准。

  - id: bug-report
    title: 功能异常 / 崩溃 / 报错
    keywords: [报错, 崩溃, 闪退, 用不了, bug, 卡住]
    route: forward
    forward_hint: |
      推荐用户下载最新版。需要用户提供：App 版本、手机型号与系统版本、出问题的操作步骤、报错截图。
